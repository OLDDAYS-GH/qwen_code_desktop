name: Build portable Qwen Desktop GUI 0.24.4
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: List assets of desktop-v0.24.4
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view desktop-v0.24.4 -R QwenLM/qwen-code --json assets

      - name: Download Qwen Desktop Setup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download desktop-v0.24.4 -R QwenLM/qwen-code -p "Qwen-Code-Desktop_0.24.4_x64-setup.exe" -O qwen-desktop-setup.exe
          Get-Item qwen-desktop-setup.exe

      - name: Silent install /S
        run: |
          .\qwen-desktop-setup.exe /S
          Start-Sleep -Seconds 25

      - name: Copy installed Tauri Desktop directory
        run: |
          $src = "$env:LOCALAPPDATA\Programs\qwen-code-desktop"
          Copy-Item $src -Destination .\qwen-desktop-portable -Recurse -Force

      - name: Compress portable folder
        run: |
          Compress-Archive -Path .\qwen-desktop-portable\* -DestinationPath qwen-desktop-portable.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qwen-desktop-portable-gui
          path: qwen-desktop-portable.zip
