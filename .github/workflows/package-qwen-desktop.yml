name: Build portable Qwen Desktop 0.24.4
on:
  workflow_dispatch: #手动触发

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Download Qwen Code Desktop Setup 0.24.4 (using curl)
        run: |
          curl -L "https://github.com/QwenLM/qwen-code/releases/download/v0.24.4/Qwen Code Desktop Setup 0.24.4.exe" -o qwen-desktop-setup.exe

      - name: Silent install /S
        run: |
          .\qwen-desktop-setup.exe /S
          Start-Sleep -Seconds 20 # 延长等待，Tauri安装释放文件较慢

      - name: Copy install directory
        run: |
          $src = "$env:LOCALAPPDATA\Programs\qwen-code-desktop"
          Copy-Item -Path $src -Destination ".\qwen-desktop-portable" -Recurse -Force

      - name: Zip portable folder
        run: |
          Compress-Archive -Path .\qwen-desktop-portable\* -DestinationPath qwen-desktop-portable.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qwen-desktop-portable
          path: qwen-desktop-portable.zip
