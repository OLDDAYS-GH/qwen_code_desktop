name: Build portable Qwen Desktop GUI 0.24.4
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Download Qwen Desktop Setup via curl
        run: |
          curl -L "https://github.com/QwenLM/qwen-code/releases/download/desktop-v0.24.4/Qwen-Code-Desktop_0.24.4_x64-setup.exe" -o qwen-desktop-setup.exe
          Get-Item qwen-desktop-setup.exe

      - name: Run silent install and wait for installer process
        run: |
          .\qwen-desktop-setup.exe /S
          # 等待安装程序进程结束
          Wait-Process -Name "Qwen-Code-Desktop_0.24.4_x64-setup" -Timeout 40
          Start-Sleep -Seconds 10
          # 列出目录，检查是否生成
          Get-ChildItem "$env:LOCALAPPDATA\Programs"

      - name: Copy installed Tauri Desktop directory
        run: |
          $src = "$env:LOCALAPPDATA\Programs\qwen-code-desktop"
          if(Test-Path $src){
            Copy-Item $src -Destination .\qwen-desktop-portable -Recurse -Force
          }else{
            Write-Error "安装目录不存在"
            exit 1
          }

      - name: Compress portable folder
        run: |
          Compress-Archive -Path .\qwen-desktop-portable\* -DestinationPath qwen-desktop-portable.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qwen-desktop-portable-gui
          path: qwen-desktop-portable.zip
